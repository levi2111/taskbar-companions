name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build TaskbarCompanions/TaskbarCompanions.csproj --configfile NuGet.Config -c Release --nologo

      - name: Logic checks
        shell: powershell
        run: |
          $output = Join-Path $PWD 'TaskbarCompanions\bin\Release\net10.0-windows'
          $run = [System.Diagnostics.Process]::Start((Join-Path $output 'TaskbarCompanions.exe'), '--self-test')
          $run.WaitForExit()
          Get-Content (Join-Path $output 'checks.txt')
          if ($run.ExitCode -ne 0) { exit 1 }

      - name: Check the status line bridge
        run: node --check bridge/claude-statusline.js
