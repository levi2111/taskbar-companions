name: Idea or feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the problem it would solve, not only the solution.
    validations:
      required: true
  - type: markdown
    attributes:
      value: Ideas that would send data anywhere, or sign in to Claude or Codex, don't fit the app's privacy promises; [CONTRIBUTING.md](https://github.com/levi2111/taskbar-companions/blob/main/CONTRIBUTING.md#ground-rules) explains why.
